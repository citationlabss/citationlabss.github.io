name: Sync Publications

# Adds a manual "Run workflow" button under the Actions tab (your sync
# button), and also runs automatically every Monday morning so the list
# stays fresh without anyone needing to remember to click it.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch publications from ORCID
        run: python scripts/fetch_orcid.py

      - name: Suggest lab tags for new publications
        run: python scripts/auto_tag.py

      - name: Commit updated publications.json and suggestions if changed
        run: |
          git config user.name "citation-labs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json data/suggested-tags.json
          if git diff --cached --quiet; then
            echo "No publication or tag-suggestion changes."
          else
            git commit -m "Sync publications from ORCID + suggest lab tags"
            git push
          fi
