name: Sync Publications

# Manual "Run workflow" button under the Actions tab, plus a weekly
# auto-run so the list stays fresh without anyone needing to click it.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch publications from ORCID
        run: python scripts/fetch_orcid.py

      - name: Commit updated publications.json if changed
        run: |
          git config user.name "citation-labs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "Sync publications from ORCID"
            git push
          fi
